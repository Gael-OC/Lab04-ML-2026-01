dataset:
  # Ruta relativa al repositorio. Cambiar este valor si el archivo .sav se
  # ubica en otra carpeta o con otro nombre.
  path: "datasets/15 atributos R0-R5.sav"

outputs:
  root: "outputs"
  tables: "outputs/tables"
  figures: "outputs/figures"
  confusion_matrices: "outputs/confusion_matrices"
  per_class: "outputs/per_class"
  # Cache de estimadores por (target, modelo). Solo se llena cuando se
  # ejecuta con --keep-estimators. Se usa para tests de significancia
  # sin reentrenar la validacion anidada.
  estimator_cache: "outputs/estimator_cache"

experiment:
  targets:
    - "GDS"
    - "GDS_R1"
    - "GDS_R2"
    - "GDS_R3"
    - "GDS_R4"
    - "GDS_R5"

  # Orden didactico de ejecucion:
  # 1) se ejecutan todos los modelos con GridSearchCV;
  # 2) luego se ejecutan todos los modelos con RandomizedSearchCV.
  # Dummy se incluye como cota inferior en ambos experimentos.
  experiments:
    - name: "grid_all"
      search_type: "grid"
      models:
        - "dummy"
        - "bagging"
        - "adaboost"
        - "stacking"
        - "gradient_boosting"

    - name: "random_all"
      search_type: "random"
      models:
        - "dummy"
        - "bagging"
        - "adaboost"
        - "stacking"
        - "gradient_boosting"

  validation:
    max_outer_folds: 5
    max_inner_folds: 3
    scoring: "f1_macro"
    n_jobs: -1

  # Semillas centralizadas para que todos los experimentos sean comparables.
  # Si se cambia una semilla, el cambio afecta de forma controlada al flujo indicado.
  random_state:
    global: 42
    outer_cv: 42
    inner_cv: 123
    model: 42
    search: 42

hyperparameter_search:
  default:
    scoring: "f1_macro"
    # 40 extracciones para random_all: mas amplio porque
    # los espacios de busqueda de los ensambles son mas grandes.
    random_n_iter: 40

  grid:
    models:
      dummy:
        enabled: true
        params: {}

      bagging:
        enabled: true
        params:
          clf__n_estimators: [50, 100, 200]
          clf__max_samples: [0.7, 1.0]
          clf__max_features: [0.5, 1.0]
          clf__estimator__max_depth: [3, 5, null]
          clf__estimator__min_samples_leaf: [1, 5]
          # Probar con y sin balanceo: el grid decide.
          clf__estimator__class_weight: [null, "balanced"]

      adaboost:
        enabled: true
        params:
          clf__n_estimators: [50, 100, 200]
          clf__learning_rate: [0.05, 0.1, 0.5, 1.0]
          # Stumps (1) suelen ganar con desbalance; se prueban 1, 2, 3, 4 y 6.
          clf__estimator__max_depth: [1, 2, 3, 4, 6]

      stacking:
        enabled: true
        params:
          clf__final_C: [0.1, 1.0, 10.0]
          clf__logistic_C: [0.1, 1.0, 10.0]
          clf__tree_max_depth: [3, null]
          clf__n_neighbors: [3, 7, 11]
          # passthrough permite que el meta-clasificador vea los features originales.
          clf__passthrough: [false, true]
          clf__geometry: ["euclidean", "manhattan"]
          clf__final_class_weight: [null, "balanced"]

      gradient_boosting:
        enabled: true
        params:
          clf__n_estimators: [50, 100, 200]
          clf__learning_rate: [0.05, 0.1, 0.2]
          clf__max_depth: [2, 3]
          clf__subsample: [0.7, 1.0]
          clf__min_samples_leaf: [1, 5]
          clf__max_features: ["sqrt", null]

  random:
    models:
      dummy:
        enabled: true
        distributions: {}

      bagging:
        enabled: true
        n_iter: 200
        distributions:
          clf__n_estimators:
            dist: "randint"
            low: 50
            high: 601
          clf__max_samples:
            dist: "uniform"
            low: 0.4
            high: 1.0
          clf__max_features:
            dist: "uniform"
            low: 0.2
            high: 1.0
          clf__estimator__max_depth:
            values: [1, 2, 3, 5, 8, 12, null]
          clf__estimator__min_samples_leaf:
            dist: "randint"
            low: 1
            high: 11
          clf__estimator__class_weight:
            values: [null, "balanced"]

      adaboost:
        enabled: true
        n_iter: 200
        distributions:
          clf__n_estimators:
            dist: "randint"
            low: 50
            high: 601
          clf__learning_rate:
            dist: "loguniform"
            low: 0.01
            high: 2.0
          clf__estimator__max_depth:
            values: [1, 2, 3, 4, 6, 8, null]
          clf__estimator__min_samples_leaf:
            dist: "randint"
            low: 1
            high: 11
          clf__estimator__class_weight:
            values: [null, "balanced"]

      stacking:
        enabled: true
        n_iter: 150
        distributions:
          clf__final_C:
            dist: "loguniform"
            low: 0.001
            high: 100.0
          clf__logistic_C:
            dist: "loguniform"
            low: 0.001
            high: 100.0
          clf__tree_max_depth:
            values: [2, 3, 5, 8, null]
          clf__n_neighbors:
            dist: "randint"
            low: 3
            high: 26
          clf__passthrough:
            values: [false, true]
          clf__geometry:
            values: ["euclidean", "manhattan", "minkowski"]
          clf__final_class_weight:
            values: [null, "balanced"]

      gradient_boosting:
        enabled: true
        n_iter: 200
        distributions:
          clf__n_estimators:
            dist: "randint"
            low: 100
            high: 601
          clf__learning_rate:
            dist: "loguniform"
            low: 0.005
            high: 0.5
          clf__max_depth:
            dist: "randint"
            low: 2
            high: 9
          clf__subsample:
            dist: "uniform"
            low: 0.5
            high: 1.0
          clf__min_samples_leaf:
            dist: "randint"
            low: 1
            high: 11
          clf__max_features:
            values: ["sqrt", "log2", 0.5, 0.8, null]
